name: Node core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-remote.cjs --check
      - run: node scripts/generate-api-capabilities.cjs --check
      - run: npm run build-app-bundle
      - run: node --test tests/unit/node-host.test.cjs tests/unit/backend-server.test.cjs
      - run: npm run build:node-core
      - uses: actions/upload-artifact@v4
        with:
          name: node-core-${{ runner.os }}-${{ runner.arch }}
          path: dist/node-core/
