name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_current_version:
        description: Retry the current version after validating its unpublished tag
        required: false
        type: boolean
        default: false
      runtime_run_id:
        description: Add verified runtime binaries from an existing six-platform build to its GitHub Release
        required: false
        type: string
      publish_run_id:
        description: Publish existing build artifacts (leave empty for normal version detection)
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: 工程检查与回归测试
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖
        run: npm ci
      - name: 验证生产依赖与脱离开发依赖的启动加载
        run: npm run check:runtime-deps
      - name: 验证随包固件与源码指纹
        run: node scripts/check-trng-firmware.cjs
      - name: 构建和验证原生钱包签名器
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          node scripts/lib/wallet-signer-runtime.cjs --install-toolchain
          npm run prepare:wallet-signer
          npm run test:wallet-signer
      - name: 静态检查、类型检查与回归测试
        run: npm run check
      - name: 原生钱包和 Agent 本地 EVM 端到端验收
        run: npm run test:quant:chain
      - name: 打包后的 Node 后台和独立签名器端到端验收
        run: npm run test:quant:bundle
      - name: 打包后的 SuperAgent 持久化与量化门控验收
        run: node tests/integration/super-agent-backend.cjs --bundled
      - name: 原生量化基础库的精度、行情恢复与持久化验收
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo +1.99.1 fmt --manifest-path native/quant-engine/Cargo.toml --check
          cargo +1.99.1 test --manifest-path native/quant-engine/Cargo.toml --locked
          cargo +1.99.1 clippy --manifest-path native/quant-engine/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.99.1 build --manifest-path native/quant-engine/Cargo.toml --release --locked
          cargo +1.99.1 fmt --manifest-path native/wallet-signer/Cargo.toml --check
          cargo +1.99.1 test --manifest-path native/wallet-signer/Cargo.toml --locked
          cargo +1.99.1 clippy --manifest-path native/wallet-signer/Cargo.toml --all-targets --locked -- -D warnings
          node --test tests/integration/quant-native-engine.test.cjs tests/integration/quant-strategies.test.cjs tests/integration/quant-event-replay.test.cjs tests/integration/quant-native-safety.test.cjs tests/integration/quant-execution-outbox.test.cjs
          node tests/integration/quant-native-backend.cjs --bundled
          node tests/integration/quant-event-replay.test.cjs --bundled
          node scripts/test-quant-chain.cjs --execution
          node scripts/test-quant-chain.cjs --execution --bundled
      - name: 验证 Release 日志和发布重跑
        run: python3 tests/release-publisher.test.py
      - name: 检查高危依赖
        run: npm audit --audit-level=high

  # ---- 检测 package.json 版本是否递增 ----
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare version with pre-push revision
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BUILD_CURRENT_VERSION: ${{ inputs.build_current_version }}
        run: |
          BASE=HEAD~1
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then BASE="$BEFORE_SHA"; fi
          PREV=$(git show "$BASE:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
          CUR=$(node -e "console.log(require('./package.json').version)")
          echo "previous=$PREV current=$CUR"
          CHANGED=false
          if [ -n "$PREV" ] && [ "$PREV" != "$CUR" ]; then CHANGED=true; fi
          if [ "$BUILD_CURRENT_VERSION" = "true" ]; then CHANGED=true; fi
          PRERELEASE=false
          case "$CUR" in *-*) PRERELEASE=true;; esac
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "version=$CUR" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # Pin the build revision while it is still a branch head. GitHub requires
      # workflow-write permission to auto-tag an unreferenced workflow commit.
      - name: Pin version tag before building
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            PINNED=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$PINNED" != "$GITHUB_SHA" ]; then
              echo "::error::Version $VERSION is already tagged at another commit; increment the version."
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi

  # GeoGebra is platform-independent. Download once on Linux, verify its pinned
  # hash, and share the archive so Windows runners need no upstream connection.
  geogebra:
    needs: [test, detect]
    if: needs.detect.outputs.changed == 'true' && inputs.publish_run_id == '' && inputs.runtime_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: .cache/geogebra
          key: geogebra-${{ hashFiles('build/geogebra-runtime.json') }}
      - name: Download and verify official GeoGebra archive
        run: node scripts/lib/geogebra-bundle.cjs --archive-only
      - uses: actions/upload-artifact@v7
        with:
          name: geogebra-archive
          path: .cache/geogebra/*.zip
          if-no-files-found: error

  # ---- 六平台打包（版本递增或手动 npm 首次发布时） ----
  build:
    needs: [test, detect, geogebra]
    if: needs.detect.outputs.changed == 'true' && inputs.publish_run_id == '' && inputs.runtime_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            script: build:win:x64
          - name: win-arm64
            os: windows-11-arm
            script: build:win:arm64
          - name: mac-x64
            os: macos-26-intel
            script: build:mac:x64
          - name: mac-arm64
            os: macos-latest
            script: build:mac:arm64
          - name: linux-x64
            os: ubuntu-latest
            script: build:linux:x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            script: build:linux:arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned native quant toolchain and target
        run: node scripts/lib/quant-engine-runtime.cjs --install-toolchain

      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build and verify native quant resource
        run: npm run prepare:quant-engine
      - name: Build and verify native wallet signer
        run: npm run test:wallet-signer

      - name: Test the actual managed native executable
        run: node tests/integration/quant-native-resource.cjs

      - name: Cache downloaded assets
        uses: actions/cache@v6
        with:
          path: |
            assets/ui-fonts
            assets/geogebra-app
            assets/geogebra
            assets/ocr
            assets/ocr-paddle
            assets/fonts
            assets/webfonts
            assets/lib
            assets/ime
            assets/aria2
            assets/node
          key: assets-${{ matrix.name }}-${{ hashFiles('scripts/download-voice-models.js', 'scripts/download-ocr-paddle.js', 'scripts/fetch-assets.sh', 'scripts/fetch-assets.ps1', 'scripts/download-aria2.js', 'scripts/build-ime-dicts.js', 'build/cli/node-runtime.json') }}

      - name: Receive verified GeoGebra archive
        uses: actions/download-artifact@v8
        with:
          name: geogebra-archive
          path: .cache/geogebra

      - name: Build (${{ matrix.name }})
        run: npm run ${{ matrix.script }}

      - name: Archive complete GitHub runtime
        run: node scripts/prepare-npm.cjs --archive

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg
            dist/*-mac.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Upload portable runtime
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.name }}
          path: |
            dist/cibyp-runtime-*.tar.gz
            dist/cibyp-runtime-*.json
          if-no-files-found: error

  # ---- 发布到 GitHub Releases（tag: v<version>） ----
  release:
    needs: [test, detect, build]
    if: always() && !cancelled() && needs.test.result == 'success' && needs.detect.result == 'success' && (needs.build.result == 'success' || inputs.publish_run_id != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify artifact revision
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.publish_run_id || github.run_id }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then exit 1; fi
          BUILD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.head_sha')
          TAG_SHA=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          if [ "$BUILD_SHA" != "$TAG_SHA" ]; then
            echo "::error::Artifacts and version tag refer to different commits."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Publish verified installers, runtime assets and commit changelog
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.publish_run_id || github.run_id }}
        run: python3 scripts/publish-runtime-assets.py

  runtime:
    needs: [test, detect]
    if: inputs.runtime_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Add verified portable runtimes without replacing existing installers or tags
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.runtime_run_id }}
        run: python3 scripts/publish-runtime-assets.py --runtime-only
