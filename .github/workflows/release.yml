name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Publish existing build artifacts (leave empty for normal version detection)
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: 工程检查与回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖
        run: npm ci
      - name: 静态检查、类型检查与回归测试
        run: npm run check
      - name: 检查高危依赖
        run: npm audit --audit-level=high

  # ---- 检测 package.json 版本是否递增 ----
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare version with pre-push revision
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE=HEAD~1
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then BASE="$BEFORE_SHA"; fi
          PREV=$(git show "$BASE:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
          CUR=$(node -e "console.log(require('./package.json').version)")
          echo "previous=$PREV current=$CUR"
          CHANGED=false
          if [ -n "$PREV" ] && [ "$PREV" != "$CUR" ]; then CHANGED=true; fi
          PRERELEASE=false
          case "$CUR" in *-*) PRERELEASE=true;; esac
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "version=$CUR" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # Pin the build revision while it is still a branch head. GitHub requires
      # workflow-write permission to auto-tag an unreferenced workflow commit.
      - name: Pin version tag before building
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            PINNED=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$PINNED" != "$GITHUB_SHA" ]; then
              echo "::error::Version $VERSION is already tagged at another commit; increment the version."
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi

  # ---- 四平台打包（版本递增时） ----
  build:
    needs: [test, detect]
    if: needs.detect.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            script: build:win:x64
          - name: win-arm64
            os: windows-11-arm
            script: build:win:arm64
          - name: mac-x64
            os: macos-26-intel
            script: build:mac:x64
          - name: mac-arm64
            os: macos-latest
            script: build:mac:arm64
          - name: linux-x64
            os: ubuntu-latest
            script: build:linux:x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            script: build:linux:arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache downloaded assets
        uses: actions/cache@v6
        with:
          path: |
            assets/ui-fonts
            assets/geogebra-app
            assets/geogebra
            assets/ocr
            assets/ocr-paddle
            assets/fonts
            assets/webfonts
            assets/lib
            assets/ime
            assets/aria2
            assets/node
          key: assets-${{ matrix.name }}-${{ hashFiles('scripts/download-voice-models.js', 'scripts/download-ocr-paddle.js', 'scripts/fetch-assets.sh', 'scripts/fetch-assets.ps1', 'scripts/download-aria2.js', 'scripts/build-ime-dicts.js', 'build/cli/node-runtime.json') }}

      - name: Build (${{ matrix.name }})
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.pkg
            dist/*-mac.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # ---- 发布到 GitHub Releases（tag: v<version>） ----
  release:
    needs: [test, detect, build]
    if: always() && needs.test.result == 'success' && needs.detect.result == 'success' && (needs.build.result == 'success' || inputs.publish_run_id != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify artifact revision
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.publish_run_id || github.run_id }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then exit 1; fi
          BUILD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.head_sha')
          TAG_SHA=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          if [ "$BUILD_SHA" != "$TAG_SHA" ]; then
            echo "::error::Artifacts and version tag refer to different commits."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
          run-id: ${{ inputs.publish_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          PRERELEASE="${{ needs.detect.outputs.prerelease }}"
          ARGS=(--title "v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "v$VERSION" release-artifacts/* --verify-tag "${ARGS[@]}"
