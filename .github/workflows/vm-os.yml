name: vm-os

# CIBYP-VM-OS 镜像构建：Debian remix，产物发布到 GitHub Release（rolling tag: vm-os-latest）。
#
# 构建路径（刻意避开 loop/parted/mount —— 容器与 WSL 里那套会直接失败）：
#   1) debos --disable-fakemachine 只产出 rootfs tar + 内核 + initramfs
#   2) vm-os/tools/assemble-image.js 用 mke2fs -d 免挂载组装整盘 ext4 → qcow2(zstd)
#   3) QEMU 直接内核引导做 boot 冒烟（cloud-init / SSH / 出厂契约 / 持久化 / 重置）
#   4) 体积门禁在 publish 阶段统一执行，超标即失败

on:
  push:
    tags: ['vm-os-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用当天日期，如 2026.09.26）'
        required: false
        default: ''
  schedule:
    - cron: '0 4 1 * *' # 每月 1 日 04:00 UTC，跟随 Debian 安全更新重建

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          set -e
          if [ "$EVENT" = "push" ] && printf '%s' "$REF" | grep -q '^vm-os-v'; then
            V="${REF#vm-os-v}"
          elif [ -n "$INPUT" ]; then
            V="$INPUT"
          else
            V="$(date -u +%Y.%m.%d)"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        variant: [base, desktop, full]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemuPkg: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemuPkg: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.variant }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装 debos（apt 优先，缺失则源码构建）
        run: |
          set -e
          sudo apt-get update -qq
          # 注意：arm64 的 noble 源里没有 debos 包（E: no installation candidate），
          # 因此 debootstrap/debos 的运行时依赖必须显式安装。
          sudo apt-get install -y --no-install-recommends \
            debootstrap e2fsprogs util-linux zstd qemu-utils ${{ matrix.qemuPkg }} || true
          if sudo apt-get install -y --no-install-recommends debos; then
            echo "debos 来自 apt: $(command -v debos)"
          else
            echo "::warning::apt 无 debos（该架构未提供），改为源码构建"
            sudo apt-get install -y --no-install-recommends build-essential git golang-go \
              libglib2.0-dev libostree-dev pkg-config
            go install github.com/go-debos/debos/cmd/debos@v1.1.7
            sudo cp "$(go env GOPATH)/bin/debos" /usr/local/bin/debos
            echo "debos 已源码构建: $(command -v debos)"
          fi
          debos --help | head -3
          debootstrap --version

      - name: 构建 rootfs + 内核（debos）
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          mkdir -p vm-os/out
          sudo -E debos --disable-fakemachine \
            --artifactdir "$PWD/vm-os/out" \
            -t version:"$VMOS_VERSION" \
            -t architecture:"${{ matrix.arch }}" \
            -t variant:"${{ matrix.variant }}" \
            vm-os/recipe/${{ matrix.variant }}.yaml
          ls -lh vm-os/out

      - name: 组装镜像（mke2fs -d，免挂载）+ 校验和
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -e
          case "${{ matrix.variant }}" in
            base) SIZE=8G ;;
            desktop) SIZE=12G ;;
            full) SIZE=16G ;;
            *) SIZE=8G ;;
          esac
          ROOTFS="$(ls -1 vm-os/out/*-rootfs.tar.* | head -1)"
          echo "rootfs: $ROOTFS"
          # mke2fs -d 需要 root（要还原 tar 中的 uid/gid/权限），否则报 Operation not permitted
          sudo -E env "PATH=$PATH" node vm-os/tools/assemble-image.js \
            --rootfs "$ROOTFS" \
            --out vm-os/out \
            --version "$VMOS_VERSION" \
            --variant "${{ matrix.variant }}" \
            --arch "${{ matrix.arch }}" \
            --size "$SIZE"
          rm -f "$ROOTFS"
          cd vm-os/out
          for f in *.qcow2 *.img 2>/dev/null; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -lh

      - name: boot 冒烟（QEMU 直接引导 + cloud-init + SSH 契约）
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          node vm-os/tests/boot-smoke.js \
            --image "vm-os/out/cibyp-vmos-${VMOS_VERSION}-${{ matrix.variant }}-${{ matrix.arch }}.qcow2" \
            --kernel "vm-os/out/vmlinuz-${{ matrix.arch }}" \
            --initrd "vm-os/out/initrd-${{ matrix.arch }}.img" \
            --arch "${{ matrix.arch }}" \
            --variant "${{ matrix.variant }}" \
            --work "$RUNNER_TEMP/vmos-smoke-${{ matrix.variant }}-${{ matrix.arch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: vmos-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            vm-os/out/*.qcow2
            vm-os/out/*.sha256
            vm-os/out/vmlinuz-*
            vm-os/out/initrd-*
            vm-os/out/image-meta-*.json
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 汇总产物
        uses: actions/download-artifact@v8
        with:
          path: vm-os-out
          merge-multiple: true
          pattern: vmos-*

      - name: 生成 runtime-manifest.json（含体积门禁）
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          node vm-os/tools/make-manifest.js \
            --dir vm-os-out \
            --version "$VMOS_VERSION" \
            --channel stable \
            --base-url "https://github.com/${{ github.repository }}/releases/download/vm-os-latest" \
            --out vm-os-out/runtime-manifest.json
          head -40 vm-os-out/runtime-manifest.json

      - name: 发布到 rolling release（vm-os-latest）
        env:
          GH_TOKEN: ${{ github.token }}
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -e
          NOTES="CIBYP-VM-OS ${VMOS_VERSION}（基于 Debian GNU/Linux 13 trixie）
          
          CIBYP-VM-OS is based on Debian GNU/Linux. Debian is a registered trademark owned by Software in the Public Interest, Inc.
          CIBYP-VM-OS is not affiliated with or endorsed by the Debian project.
          
          资产说明：每个变体 × 架构一份 qcow2（base/desktop/full）+ 内核/initrd（宿主 QEMU 直接引导）。
          清单：runtime-manifest.json（含 sha256、大小、体积门禁与兼容性信息）。"
          if ! gh release view vm-os-latest >/dev/null 2>&1; then
            gh release create vm-os-latest --title "CIBYP-VM-OS (latest)" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release edit vm-os-latest --notes "$NOTES"
          fi
          gh release view vm-os-latest --json assets -q '.assets[].name' | while read -r name; do
            case "$name" in
              *"${VMOS_VERSION}"*|runtime-manifest.json) ;;
              *) gh release delete-asset vm-os-latest "$name" -y || true ;;
            esac
          done
          gh release upload vm-os-latest vm-os-out/* --clobber
