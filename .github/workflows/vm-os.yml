name: vm-os

# CIBYP-VM-OS 镜像构建：Debian remix，产物发布到 GitHub Release（rolling tag: vm-os-latest）。
# - 构建用 debos（Ubuntu 官方源提供），--disable-fakemachine 直接在 runner 上执行，
#   因此不需要 /dev/kvm，amd64 / arm64 原生 runner 都能跑。
# - 每个变体构建后立刻做 boot 冒烟（QEMU 直接引导内核 + cloud-init over HTTP + SSH 契约校验）。
# - 体积门禁在 publish 阶段由 make-manifest.js 统一执行，超标即失败。

on:
  push:
    tags: ['vm-os-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用当天日期，如 2026.09.25）'
        required: false
        default: ''
  schedule:
    - cron: '0 4 1 * *' # 每月 1 日 04:00 UTC，跟随 Debian 安全更新重建

permissions:
  contents: write

jobs:
  # ---- 版本号归一 ----
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          set -e
          if [ "$EVENT" = "push" ] && printf '%s' "$REF" | grep -q '^vm-os-v'; then
            V="${REF#vm-os-v}"
          elif [ -n "$INPUT" ]; then
            V="$INPUT"
          else
            V="$(date -u +%Y.%m.%d)"
          fi
          echo "VMOS_VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

  # ---- 构建 3 变体 × 2 架构 ----
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        variant: [base, desktop, full]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemuPkg: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemuPkg: qemu-system-arm
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.variant }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装构建与冒烟依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debos qemu-utils e2fsprogs util-linux parted kpartx \
            ${{ matrix.qemuPkg }}

      - name: 构建镜像（debos）
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          mkdir -p vm-os/out
          sudo -E debos --disable-fakemachine \
            --artifactdir "$PWD/vm-os/out" \
            -t version:"$VMOS_VERSION" \
            -t architecture:"${{ matrix.arch }}" \
            -t variant:"${{ matrix.variant }}" \
            vm-os/recipe/${{ matrix.variant }}.yaml
          ls -lh vm-os/out

      - name: 转换为 qcow2 + 计算校验和
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -e
          cd vm-os/out
          IMG="cibyp-vmos-${VMOS_VERSION}-${{ matrix.variant }}-${{ matrix.arch }}.img"
          QCOW="cibyp-vmos-${VMOS_VERSION}-${{ matrix.variant }}-${{ matrix.arch }}.qcow2"
          qemu-img convert -O qcow2 -c -o compression_type=zstd "$IMG" "$QCOW"
          rm -f "$IMG"
          sha256sum "$QCOW" > "$QCOW.sha256"
          for f in "vmlinuz-${{ matrix.arch }}" "initrd-${{ matrix.arch }}.img"; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -lh

      - name: boot 冒烟（QEMU 直接引导 + cloud-init + SSH 契约）
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          node vm-os/tests/boot-smoke.js \
            --image "vm-os/out/cibyp-vmos-${VMOS_VERSION}-${{ matrix.variant }}-${{ matrix.arch }}.qcow2" \
            --kernel "vm-os/out/vmlinuz-${{ matrix.arch }}" \
            --initrd "vm-os/out/initrd-${{ matrix.arch }}.img" \
            --arch "${{ matrix.arch }}" \
            --variant "${{ matrix.variant }}" \
            --work "$RUNNER_TEMP/vmos-smoke-${{ matrix.variant }}-${{ matrix.arch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: vmos-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            vm-os/out/*.qcow2
            vm-os/out/*.sha256
            vm-os/out/vmlinuz-*
            vm-os/out/initrd-*
          if-no-files-found: error

  # ---- 汇总 manifest + 发布 rolling release ----
  publish:
    needs: [version, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 汇总产物
        uses: actions/download-artifact@v8
        with:
          path: vm-os-out
          merge-multiple: true
          pattern: vmos-*

      - name: 生成 runtime-manifest.json（含体积门禁）
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          node vm-os/tools/make-manifest.js \
            --dir vm-os-out \
            --version "$VMOS_VERSION" \
            --channel stable \
            --base-url "https://github.com/${{ github.repository }}/releases/download/vm-os-latest" \
            --out vm-os-out/runtime-manifest.json
          head -40 vm-os-out/runtime-manifest.json

      - name: 发布到 rolling release（vm-os-latest）
        env:
          GH_TOKEN: ${{ github.token }}
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -e
          NOTES="CIBYP-VM-OS ${VMOS_VERSION}（基于 Debian GNU/Linux 13 trixie）
          
          CIBYP-VM-OS is based on Debian GNU/Linux. Debian is a registered trademark owned by Software in the Public Interest, Inc.
          CIBYP-VM-OS is not affiliated with or endorsed by the Debian project.
          
          资产说明：每个变体 × 架构一份 qcow2（base/desktop/full），内核与 initrd 由宿主 QEMU 直接引导使用。
          清单：runtime-manifest.json（含 sha256、大小、体积门禁与兼容性信息）。"
          if ! gh release view vm-os-latest >/dev/null 2>&1; then
            gh release create vm-os-latest --title "CIBYP-VM-OS (latest)" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release edit vm-os-latest --notes "$NOTES"
          fi
          # 清理旧版本资产（只保留当前版本）
          gh release view vm-os-latest --json assets -q '.assets[].name' | while read -r name; do
            case "$name" in
              *"${VMOS_VERSION}"*|runtime-manifest.json) ;;
              *) gh release delete-asset vm-os-latest "$name" -y || true ;;
            esac
          done
          gh release upload vm-os-latest vm-os-out/* --clobber
