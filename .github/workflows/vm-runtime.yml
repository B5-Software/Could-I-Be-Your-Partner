name: vm-runtime

# QEMU 运行时包构建：把官方 QEMU 裁剪成"只够跑 CIBYP-VM-OS"的 zip（含依赖闭包 + 固件 + 许可），
# 发布到 rolling release（tag: vm-runtime-latest），供应用内按需下载。
# 六个平台：win32/linux/darwin × x64/arm64。

on:
  push:
    tags: ['vm-runtime-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空用当天日期）'
        required: false
        default: ''
  schedule:
    - cron: '0 5 1 * *' # 每月 1 日，跟随 QEMU 上游更新

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          set -e
          if [ "$EVENT" = "push" ] && printf '%s' "$REF" | grep -q '^vm-runtime-v'; then
            V="${REF#vm-runtime-v}"
          elif [ -n "$INPUT" ]; then
            V="$INPUT"
          else
            V="$(date -u +%Y.%m.%d)"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

  pack:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win32, arch: x64 }
          - { runner: windows-11-arm, platform: win32, arch: arm64 }
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { runner: macos-26-intel, platform: darwin, arch: x64 }
          - { runner: macos-latest, platform: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 准备依赖（adm-zip 打包用）
        run: npm install adm-zip --no-save --no-audit --no-fund

      # ---- Windows：下载官方安装包并解包（官方包是 requireAdministrator，只能解包不能静默安装） ----
      - name: 获取 QEMU（Windows）
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $ver = '20260811'
          $url = "https://qemu.weilnetz.de/w64/qemu-w64-setup-$ver.exe"
          New-Item -ItemType Directory -Force -Path qemu-src | Out-Null
          # 上游是单机小服务器，CI 上偶发超时/限速 → 多重试 + 体积校验
          curl.exe -L --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o qemu-setup.exe $url
          $size = (Get-Item qemu-setup.exe).Length
          if ($size -lt 150MB) { throw "QEMU 安装包下载不完整: $size 字节" }
          Write-Host "已下载: $([math]::Round($size/1MB,1))MB"
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if ($cmd) { $sevenZip = $cmd.Source } else { choco install 7zip -y --no-progress; $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          }
          & $sevenZip x -y -oqemu-src qemu-setup.exe | Out-Null
          $count = (Get-ChildItem qemu-src -File | Measure-Object).Count
          if ($count -lt 100) { throw "解包异常：只有 $count 个文件" }
          Write-Host "解包完成: $count 个文件"

      - name: 获取 QEMU（Linux）
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-utils patchelf
          # 统一布局：把二进制放进 <src>/bin，脚本按 bin/ 查找
          mkdir -p qemu-src/bin
          cp /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 /usr/bin/qemu-system-xtensa /usr/bin/qemu-img qemu-src/bin/ 2>/dev/null || \
            cp /usr/bin/qemu-system-x86_64 /usr/bin/qemu-system-aarch64 /usr/bin/qemu-img qemu-src/bin/
          ls -l qemu-src/bin

      - name: 获取 QEMU（macOS）
        if: matrix.platform == 'darwin'
        run: |
          brew install qemu dylibbundler
          PREFIX="$(brew --prefix)"
          mkdir -p qemu-src/bin
          cp "$PREFIX"/opt/qemu/bin/qemu-system-x86_64 "$PREFIX"/opt/qemu/bin/qemu-system-aarch64 qemu-src/bin/ 2>/dev/null || true
          cp "$PREFIX"/opt/qemu/bin/qemu-img qemu-src/bin/
          cp -R "$PREFIX"/opt/qemu/share qemu-src/share
          ls -l qemu-src/bin

      - name: 裁剪打包
        shell: bash
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          node scripts/vm-pack.js \
            --src qemu-src \
            --out dist/vm-pack \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --zip
          cp dist/vm-pack/runtime-pack.json dist/.meta-${{ matrix.platform }}-${{ matrix.arch }}.json
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: qemu-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/.meta-*.json
          if-no-files-found: error

  publish:
    needs: [version, pack]
    if: needs.pack.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: pack-artifacts
          merge-multiple: true
          pattern: qemu-*
      - name: 生成 runtime-pack-manifest.json
        env:
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          node vm-os/tools/make-runtime-pack-manifest.js \
            --dir pack-artifacts \
            --base-url "https://github.com/${{ github.repository }}/releases/download/vm-runtime-latest" \
            --version "$VMOS_VERSION" \
            --out pack-artifacts/runtime-pack-manifest.json
      - name: 发布到 rolling release（vm-runtime-latest）
        env:
          GH_TOKEN: ${{ github.token }}
          VMOS_VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -e
          NOTES="CIBYP QEMU 运行时包 ${VMOS_VERSION}
          
          QEMU is licensed under GPLv2. This package contains unmodified upstream binaries plus runtime dependencies.
          Source: https://www.qemu.org/download/#source
          
          资产：cibyp-qemu-<platform>-<arch>.zip（已裁剪依赖闭包 + share 固件 + COPYING）。"
          if ! gh release view vm-runtime-latest >/dev/null 2>&1; then
            gh release create vm-runtime-latest --title "CIBYP QEMU Runtime (latest)" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release edit vm-runtime-latest --notes "$NOTES"
          fi
          # 只保留当前版本资产（manifest 永远保留）
          gh release view vm-runtime-latest --json assets -q '.assets[].name' | while read -r name; do
            case "$name" in
              runtime-pack-manifest.json) ;;
              *) gh release delete-asset vm-runtime-latest "$name" -y || true ;;
            esac
          done
          gh release upload vm-runtime-latest pack-artifacts/* --clobber
