name: Code checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Prepare desktop icons
        run: pwsh -NoProfile -File scripts/fetch-assets.ps1 -SkipOCR -SkipGeoGebra -SkipThree
        if: runner.os == 'Windows' && matrix.node == '24'
      - run: npm run test:desktop
        if: runner.os == 'Windows' && matrix.node == '24'
      - run: npm audit --audit-level=high
  macos-computer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:computer
      - run: node --test tests/unit/computer-use.test.cjs
      - run: npx electron tests/integration/macos-computer-smoke.cjs
