name: npm-launcher

on:
  workflow_run:
    workflows: [build-release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-macos:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check whether launcher verification is needed
        id: version
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const version=require('./packages/npm/package.json').version;
          fetch('https://registry.npmjs.org/cibyp/'+encodeURIComponent(version),{signal:AbortSignal.timeout(30000)}).then(response=>{
            if(![200,404].includes(response.status)) throw new Error('npm lookup failed: HTTP '+response.status);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+(response.status===404)+'\n');
          }).catch(error=>{console.error(error.message);process.exitCode=1});
          JS
      - run: npm ci
        if: steps.version.outputs.needed == 'true'
      - name: Verify local signing with real Electron helpers and renderer
        if: steps.version.outputs.needed == 'true'
        run: node --test tests/unit/npm-macos-sign.test.cjs tests/unit/npm-distribution.test.cjs tests/unit/npm-download.test.cjs tests/integration/npm-macos-sign.cjs
      - name: Verify full GitHub runtime installation and user launcher
        if: steps.version.outputs.needed == 'true'
        env:
          CIBYP_CACHE_DIR: ${{ runner.temp }}/cibyp-macos-runtime
          CIBYP_DESKTOP_DIR: ${{ runner.temp }}/cibyp-macos-applications
          GH_TOKEN: ${{ github.token }}
        run: node packages/npm/bin/cibyp.cjs --install-only
  publish:
    needs: verify-macos
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-launcher-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        run: |
          node - <<'JS'
          const {execFileSync}=require('node:child_process');
          const version=execFileSync('npm',['--version'],{encoding:'utf8'}).trim();
          const [major,minor,patch]=version.split('.').map(Number);
          if(!(major>11 || major===11 && (minor>5 || minor===5 && patch>=1))) {
            throw new Error('Trusted publishing requires npm >= 11.5.1; found '+version);
          }
          console.log('Trusted publishing supported by npm '+version);
          JS
      - name: Verify npm trusted publisher without publishing a version
        run: node scripts/verify-npm-oidc.cjs
      - name: Check whether the independent launcher version needs publishing
        id: version
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const version=require('./packages/npm/package.json').version;
          fetch('https://registry.npmjs.org/cibyp/'+encodeURIComponent(version),{signal:AbortSignal.timeout(30000)}).then(response=>{
            if(![200,404].includes(response.status)) throw new Error('npm lookup failed: HTTP '+response.status);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+(response.status===404)+'\n');
            console.log(response.status===200?'Launcher version already published; no npm changes needed.':'Preparing the new launcher version.');
          }).catch(error=>{console.error(error.message);process.exitCode=1});
          JS
      - name: Verify launcher, download safety and update behavior
        if: steps.version.outputs.needed == 'true'
        run: npm run test:npm
      - name: Verify official GitHub runtimes exist
        id: runtime
        if: steps.version.outputs.needed == 'true'
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
        run: node -e "require('./packages/npm/lib/releases.cjs').discoverRelease().then(m=>{require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'ready=true\n');console.log('Verified runtime release '+m.version)}).catch(e=>{console.error(e.message);if(process.env.MANUAL==='true')process.exitCode=1;else console.log('::notice::Publish complete runtime assets before the first launcher publication.')})"
      - name: Prepare one small JavaScript package
        if: steps.runtime.outputs.ready == 'true'
        run: npm run prepare:npm -- --output npm-dist
      - name: Publish only the launcher using OIDC
        if: steps.runtime.outputs.ready == 'true'
        run: npm run publish:npm -- npm-dist
