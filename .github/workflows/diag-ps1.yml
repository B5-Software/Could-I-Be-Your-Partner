name: diag-ps1
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Line count and tail
        shell: pwsh
        run: |
          $f = 'scripts/fetch-assets.ps1'
          Write-Host "lines: $((Get-Content $f).Count)"
          Write-Host "bytes: $((Get-Item $f).Length)"
      - name: Parse check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/fetch-assets.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output ("Line {0} Col {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            exit 1
          } else {
            Write-Output 'PARSE OK'
          }
      - name: Hexdump around line 286
        shell: pwsh
        run: |
          $lines = Get-Content 'scripts/fetch-assets.ps1'
          for ($i = 278; $i -le 285; $i++) {
            $l = $lines[$i]
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($l)
            $hex = ($bytes | ForEach-Object { $_.ToString('X2') }) -join ' '
            Write-Output ("line {0}: [{1}]" -f ($i + 1), $hex)
          }
      - name: Run fetch-assets.ps1
        shell: pwsh
        run: |
          ./scripts/fetch-assets.ps1 -SkipGeoGebra -SkipOCR -SkipFontAwesome -SkipThree