<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Could I Be Your Partner · Wallet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">C</span>
      <div>
        <strong>Could I Be Your Partner</strong>
        <p data-text="wbTitle"></p>
      </div>
      <span class="local" data-text="wbLocal"></span>
    </header>
    <main>
      <section class="intro">
        <span class="eyebrow">CIBYP WALLET</span>
        <h1 data-text="wbTitle"></h1>
        <p data-text="wbInstructions"></p>
      </section>
      <section id="connection" hidden>
        <span id="connection-badge" class="badge"></span>
        <p data-text="wbReadyHint"></p>
        <label data-text="wbFingerprint"></label><code id="fingerprint"></code
        ><button id="forget" class="secondary" data-text="wbForget"></button>
      </section>
      <form id="pair-form">
        <label for="pair-uri" data-text="wbAddress"></label
        ><textarea
          id="pair-uri"
          rows="4"
          autocomplete="off"
          spellcheck="false"
          placeholder="cibyp-wallet://pair#…"
          required
        ></textarea>
        <label for="browser-name" data-text="wbName"></label>
        <input id="browser-name" type="text" maxlength="80" autocomplete="off" />
        <section id="browser-identity" hidden>
          <label data-text="wbClientFingerprint"></label>
          <code id="client-fingerprint"></code>
        </section>
        <button id="pair" type="submit" data-text="wbConnect"></button>
      </form>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <p class="privacy" data-text="wbHint"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
