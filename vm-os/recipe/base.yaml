# CIBYP-VM-OS「base」变体：Agent 默认执行环境。
# 目标体积 ≤ 350MB（qcow2, zstd）。只装"跑命令/改代码/装包"必需的底座，
# 重型语言栈与数据库交给 full 变体，避免默认下载过大。

{{- $arch := or .architecture "amd64" }}
{{- $version := or .version "0.1.0" }}
{{- $variant := "base" }}

architecture: {{$arch}}

actions:
  - action: recipe
    recipe: common.yaml
    variables:
      architecture: {{$arch}}
      variant: {{$variant}}
      version: {{$version}}

  # base 保持精简：不在默认下载里塞开发工具（cmake/gdb/man-db/git-lfs 等放 full 变体）
  - action: recipe
    recipe: tail.yaml
    variables:
      architecture: {{$arch}}
      variant: {{$variant}}
      version: {{$version}}
      imagesize: 8G
