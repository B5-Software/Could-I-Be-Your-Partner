# CIBYP-VM-OS「full」变体：完整开发环境（语言工具链 + 数据库 + 容器 + 媒体）。
# base + clang/cmake/调试器 + PostgreSQL/MariaDB/Redis/SQLite + Docker + ffmpeg + Playwright 依赖。
# 目标体积 ≤ 1.3GB（qcow2, zstd）。
#
# 刻意不装：Rust/Go/Java 工具链（单个 500MB~1GB 且版本敏感），需要时 VM 内自行安装。

{{- $arch := or .architecture "amd64" }}
{{- $version := or .version "0.1.0" }}
{{- $variant := "full" }}

architecture: {{$arch}}

actions:
  - action: recipe
    recipe: common.yaml
    variables:
      architecture: {{$arch}}
      variant: {{$variant}}
      version: {{$version}}

  # 调试与构建工具链
  - action: apt
    packages:
      - clang
      - lld
      - gdb
      - strace
      - ltrace
      - cmake
      - autoconf
      - automake
      - libtool
      - bison
      - flex
      - gettext
      - pkgconf
      - python3-dev
      - git-lfs
      - tree
      - ncdu
      - man-db
      - vim
      - shellcheck
      - rsync
      - patchelf
      - file
      - dos2unix

  # 常用开发库（编译原生模块用）
  - action: apt
    packages:
      - libssl-dev
      - zlib1g-dev
      - libffi-dev
      - libsqlite3-dev
      - libpq-dev
      - libxml2-dev
      - libxslt1-dev
      - libjpeg-dev
      - libpng-dev
      - libwebp-dev
      - libcurl4-openssl-dev
      - libncurses-dev
      - libreadline-dev

  # 数据库与缓存
  - action: apt
    packages:
      - postgresql
      - postgresql-client
      - mariadb-server
      - mariadb-client
      - redis-server
      - sqlite3
      - libsqlite3-0

  # 容器（VM 内再跑容器，用于依赖服务编排）
  - action: apt
    packages:
      - docker.io
      - docker-compose
      - fuse-overlayfs

  # 媒体与文档处理
  - action: apt
    packages:
      - ffmpeg
      - imagemagick
      - poppler-utils
      - pandoc
      - qpdf
      - ghostscript
      - tesseract-ocr
      - tesseract-ocr-chi-sim
      - tesseract-ocr-eng

  # Playwright / Chromium 运行依赖（宿主可用 CDP 接管 VM 内浏览器）
  - action: apt
    packages:
      - libnss3
      - libnspr4
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libatspi2.0-0
      - libcups2
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libpango-1.0-0
      - libcairo2
      - libasound2
      - libwayland-client0
      - libxshmfence1

  - action: recipe
    recipe: tail.yaml
    variables:
      architecture: {{$arch}}
      variant: {{$variant}}
      version: {{$version}}
      imagesize: 16G
