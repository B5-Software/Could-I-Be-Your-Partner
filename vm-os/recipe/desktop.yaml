# CIBYP-VM-OS「desktop」变体：图形化 / computer-use / 浏览器沙盒。
# base + X11 + x11vnc + Chromium（宿主可用 CDP 跨网接管浏览器）。
# 目标体积 ≤ 750MB（qcow2, zstd）。

{{- $arch := or .architecture "amd64" }}
{{- $version := or .version "0.1.0" }}
{{- $variant := "desktop" }}

architecture: {{$arch}}

actions:
  - action: recipe
    recipe: common.yaml
    variables:
      architecture: {{$arch}}
      variant: {{$variant}}
      version: {{$version}}

  # 图形栈：Xorg + x11vnc + 轻量 WM（无 systemd 图形会话依赖，适合 headless VM）
  - action: apt
    packages:
      - xserver-xorg
      - xserver-xorg-video-dummy
      - xinit
      - x11-utils
      - x11vnc
      - openbox
      - xterm
      - xdotool
      - xauth
      - dbus-x11
      - at-spi2-core
      - libgl1-mesa-dri
      - mesa-utils

  # 浏览器与字体（computer-use / 网页自动化 / 截图）
  - action: apt
    packages:
      - chromium
      - fonts-noto-cjk
      - fonts-noto-color-emoji
      - fonts-wqy-zenhei
      - fonts-dejavu-core
      - imagemagick

  - action: recipe
    recipe: tail.yaml
    variables:
      architecture: {{$arch}}
      variant: {{$variant}}
      version: {{$version}}
      imagesize: 12G
