# CIBYP-VM-OS 公共层：debootstrap + 基础软件集 + 品牌化配置。
# 由 base.yaml / desktop.yaml / full.yaml 通过 `recipe` action 引入，
# 变体配方在引入后追加自己的软件层，再走 tail.yaml 落盘。
#
# 模板变量：
#   architecture  目标架构（amd64 / arm64）
#   variant       变体名（base / desktop / full）
#   version       CIBYP-VM-OS 版本号

{{- $arch := or .architecture "amd64" }}
{{- $version := or .version "0.1.0" }}

architecture: {{$arch}}

actions:
  - action: debootstrap
    suite: trixie
    mirror: https://deb.debian.org/debian
    components: [ main ]
    variant: minbase
    check-gpg: true

  # ---- 系统底座（与发行版无关的通用工具） ----
  - action: apt
    update: true
    packages:
      - systemd-sysv
      - initramfs-tools
      - dbus
      - netbase
      - iproute2
      - iputils-ping
      - dnsutils
      - netcat-openbsd
      - ca-certificates
      - gnupg
      - locales
      - tzdata
      - sudo
      - less
      - vim-tiny
      - nano
      - bash-completion
      - procps
      - psmisc
      - htop
      - tmux
      - rsync
      - curl
      - wget
      - git
      - jq
      - unzip
      - tar
      - zstd
      - xz-utils
      - file
      - ripgrep

  # ---- 沙盒接入层（宿主 App 依赖） ----
  - action: apt
    packages:
      - cloud-init
      - openssh-server
      - qemu-guest-agent
      - systemd-resolved
      - zram-tools
      - unattended-upgrades
      # cloud-init 的整盘扩容（growfs → resize2fs）依赖 e2fsprogs；
      # debootstrap minbase 不自带，缺了会导致首启 cloud-init 报错（实测）
      - e2fsprogs

  # ---- 开发基础（完整语言栈由 full 变体补齐） ----
  - action: apt
    packages:
      - python3
      - python3-venv
      - python3-pip
      - nodejs
      - npm
      - build-essential
      - pkg-config
      - make

  # ---- 内核 ----
  - action: apt
    packages:
      {{- if eq $arch "amd64" }}
      - linux-image-amd64
      {{- else }}
      - linux-image-arm64
      {{- end }}

  # ---- 品牌化 / 出厂配置 ----
  # 用 overlay 把脚本放进 rootfs 再用 sh 执行：debos 的 `script:` 在子目录路径/执行位上
  # 有坑（实测 "setup.sh: not found"），overlay + command 最稳。
  - action: overlay
    source: overlay
    destination: /opt/cibyp-overlay

  - action: run
    chroot: true
    label: CIBYP 出厂配置
    command: sh /opt/cibyp-overlay/setup.sh
