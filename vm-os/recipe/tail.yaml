#
# CIBYP-VM-OS 落盘层：只产出 rootfs 包。
#
# 为什么不用 image-partition + filesystem-deploy：
#   那套需要 loop 设备与 mount 特权（parted 刷新分区表在容器/WSL 里直接失败：
#   "unable to inform the kernel of the change"），CI 与本地都不稳。
#   改为「debos 只做 rootfs」+「vm-os/tools/assemble-image.js 用 mke2fs -d 免挂载组装镜像」，
#   并且**不带分区表**（整盘 ext4，宿主直接 -kernel 引导，root=LABEL=cibyp-root）。
#
# 产物（artifact 目录）：
#   cibyp-vmos-<version>-<variant>-<arch>-rootfs.tar.zst   rootfs 包（组装镜像 + 抽内核用）

{{- $arch := or .architecture "amd64" }}
{{- $variant := or .variant "base" }}
{{- $version := or .version "0.1.0" }}

architecture: {{$arch}}

actions:
  # 收尾（必须在所有 apt 之后）：体积清理 + 出厂干净化
  - action: run
    chroot: true
    label: CIBYP 收尾清理
    command: sh /opt/cibyp-overlay/finalize.sh

  - action: pack
    # 注意：Ubuntu noble 自带的 debos（1.1.x）pack 只支持 gz/bzip2/xz/none（不支持 zstd）。
    # 这里只是为了把 rootfs 搬出来（组装完即删），用 gz 换速度（xz 单线程约 6 分钟）；
    # 组装脚本用 `tar -xf` 自动识别压缩格式。
    file: cibyp-vmos-{{$version}}-{{$variant}}-{{$arch}}-rootfs.tar.gz
    compression: gz
