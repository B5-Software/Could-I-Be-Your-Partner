[package]
name = "cibyp-wallet-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = { version = "=1.8.2", features = ["derive"] }
getrandom = "=0.2.16"
argon2 = { version = "=0.5.3", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
bip32 = "=0.5.3"
bip39 = { version = "=2.2.0", features = ["zeroize"] }
sha2 = "=0.10.9"
sha3 = "=0.10.8"
scrypt = "=0.11.0"
pbkdf2 = "=0.12.2"
aes = "=0.8.4"
ctr = "=0.9.2"
subtle = "=2.6.1"
ethnum = "=1.5.3"
rlp = "=0.5.2"
hex = "=0.4.3"
unicode-normalization = "=0.1.26"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
hkdf = "=0.12.4"
alloy-sol-types = "=1.7.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
