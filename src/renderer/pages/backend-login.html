<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CIBYP · WebUI</title><link rel="stylesheet" href="/src/renderer/css/motion.css"><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:light-dark(#f4f5f9,#12141b);color:light-dark(#202532,#e5e8f0)}form{width:min(360px,calc(100vw - 64px));padding:32px;border:1px solid #8690aa44;border-radius:20px;background:light-dark(white,#1d202a);box-shadow:0 12px 50px #0001}h1{font-size:22px;margin:0 0 12px}p{font-size:14px;line-height:1.6;opacity:.8}label{display:block;margin:18px 0 6px;font-size:14px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #8690aa66;border-radius:10px;background:transparent;color:inherit}input:focus-visible,button:focus-visible{outline:2px solid #5979e6;outline-offset:3px}button{margin-top:22px;background:#4b67c4;color:white;cursor:pointer}#error{min-height:20px;color:#e96565}button:disabled{opacity:.6}</style></head><body><form><h1>Could I Be Your Partner</h1><p id="intro"></p><label id="passwordLabel" for="password"></label><input id="password" type="password" autocomplete="current-password" required><label id="codeLabel" for="code"></label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><p id="error" role="alert"></p><button id="submit"></button></form><script>
const zh=navigator.language.startsWith('zh');document.querySelector('#intro').textContent=zh?'连接共享后台。GUI、TUI 和 WebUI 使用相同的会话、工具与设置。':'Connect to the shared backend. GUI, TUI and WebUI share sessions, tools and settings.';document.querySelector('#passwordLabel').textContent=zh?'访问密码':'Access password';document.querySelector('#codeLabel').textContent=zh?'二次验证码（如已启用）':'Verification code (if enabled)';const button=document.querySelector('#submit');button.textContent=zh?'连接':'Connect';document.querySelector('form').onsubmit=async e=>{e.preventDefault();button.disabled=true;document.querySelector('#error').textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-CIBYP-Client':'1'},body:JSON.stringify({password:document.querySelector('#password').value,code:document.querySelector('#code').value})});const result=await response.json();if(!response.ok)throw Error(result.error);location.replace('/');}catch(error){document.querySelector('#error').textContent=error.message;button.disabled=false;}};
</script></body></html>
