<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
  <title>Could I Be Your Partner · WebUI</title>
  <link rel="stylesheet" href="/src/renderer/css/motion.css">
  <script>/* CIBYP_LOGIN_PREFERENCES */</script>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color-scheme:light;--bg:#f5f7fa;--fg:#17212b;--muted:#607080;--accent:#4265d6;--on-accent:white;--card:#ffffffeb;--line:#1925371c;--field:#f4f6f9;--shadow:#17253712}
    :root[data-theme=dark]{color-scheme:dark;--fg:#eef2f7;--muted:#a4afbd;--card:#1d242eee;--line:#ffffff21;--field:#ffffff08;--shadow:#0005}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--fg);display:grid;place-items:center;padding:44px 24px;background-image:radial-gradient(ellipse at 16% 12%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 52%)}
    .shell{width:min(990px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:88px;align-items:center}.brand{display:flex;gap:13px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.02em}.brand img{width:38px;height:38px;border-radius:11px}.eyebrow{color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700;margin-top:58px}.story h1{font-size:clamp(32px,4vw,46px);font-weight:650;line-height:1.22;letter-spacing:-.045em;margin:18px 0 22px;white-space:pre-line}.story p{font-size:15px;line-height:1.85;color:var(--muted);max-width:390px}.features{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}.features span{border:1px solid var(--line);border-radius:100px;padding:8px 13px;color:var(--muted);font-size:12px}.story-foot{margin-top:54px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .card{background:var(--card);border:1px solid var(--line);padding:36px;border-radius:24px;box-shadow:0 24px 65px var(--shadow)}.connect-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.card h2{font-size:25px;letter-spacing:-.03em;margin:22px 0 8px}.intro{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 26px}label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}.field{position:relative}input{font:inherit;font-size:15px;width:100%;height:49px;padding:0 14px;background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:11px}input[type=password]{padding-right:46px}input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{font:inherit;cursor:pointer}.reveal{position:absolute;right:7px;top:7px;width:35px;height:35px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:8px}.reveal svg{width:19px}.code-wrap{margin-top:22px}.submit{margin-top:18px;border:0;border-radius:11px;width:100%;min-height:48px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px}.submit svg{width:17px}.submit:disabled{opacity:.65;cursor:wait}#error{font-size:12px;line-height:1.6;color:#bd3838;margin:14px 0 0}#error:empty{margin-top:0}.privacy{display:flex;align-items:flex-start;gap:9px;margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:11px;line-height:1.7;color:var(--muted)}.privacy svg{flex-shrink:0;width:15px;margin-top:1px}.host{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;color:var(--muted);margin:22px 0 0;text-align:center}.card{animation:enter .35s ease-out}@keyframes enter{from{opacity:0}to{opacity:1}}html[data-motion=off] *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:760px){body{padding:28px 20px}.shell{grid-template-columns:1fr;gap:28px;max-width:440px}.eyebrow{margin-top:28px}.story h1{font-size:30px;margin:12px 0}.story p,.features,.story-foot{display:none}.card{padding:28px}.card h2{font-size:23px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="story">
      <div class="brand"><img src="/assets/icons/icon.png" alt=""><span>Could I Be Your Partner</span></div>
      <div class="eyebrow">CIBYP · WebUI</div><h1 id="headline"></h1><p id="description"></p>
      <div class="features"><span id="sessions"></span><span id="workspace"></span><span id="preferences"></span></div>
      <div class="story-foot"><span class="dot"></span><span id="ready"></span></div>
    </section>
    <section>
      <form class="card">
        <div class="connect-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4M8 9l3 2-3 2m6 0h2"/></svg></div>
        <h2 id="title"></h2><p class="intro" id="intro"></p><label id="passwordLabel" for="password"></label>
        <div class="field"><input id="password" type="password" autocomplete="current-password" required autofocus><button class="reveal" type="button" id="reveal" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
        <div class="code-wrap" id="codeWrap" hidden><label id="codeLabel" for="code"></label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000"></div>
        <p id="error" role="alert" aria-live="polite"></p><button class="submit" id="submit" type="submit"><span id="buttonText"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
        <div class="privacy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></svg><span id="privacy"></span></div>
      </form><p class="host" id="host"></p>
    </section>
  </main>
  <script>
    const preferences=window.cibypLoginPreferences||{}, lang=String(preferences.language||navigator.language).split('-')[0];
    const translations={
      zh:{headline:'你的伙伴，\n随时相伴。',description:'在浏览器继续你的任务。对话、工作区和设置与桌面端实时共享，无需重复配置。',sessions:'同一套会话',workspace:'同一个工作区',preferences:'同步设置',ready:'后台已就绪',title:'连接你的 CIBYP',intro:'输入在桌面或终端设置的 WebUI 访问密码。',passwordLabel:'访问密码',codeLabel:'二次验证码',buttonText:'连接并继续',privacy:'登录状态仅保留在此浏览器。请通过可信网络访问你的设备。',reveal:'显示或隐藏密码',loading:'正在连接…',invalid:'密码或验证码不正确，请重试。',limited:'尝试次数过多，请稍等一分钟。',offline:'连接失败，请检查网络与后台状态。'},
      en:{headline:'Your partner.\nWherever you are.',description:'Continue your work in the browser. Conversations, workspaces and preferences stay in sync with your desktop.',sessions:'Shared conversations',workspace:'One workspace',preferences:'Synced preferences',ready:'Backend ready',title:'Connect to your CIBYP',intro:'Enter the WebUI password set on your desktop or terminal.',passwordLabel:'Access password',codeLabel:'Verification code',buttonText:'Connect and continue',privacy:'Your login stays in this browser. Access your device over a trusted network.',reveal:'Show or hide password',loading:'Connecting…',invalid:'Incorrect password or verification code. Try again.',limited:'Too many attempts. Please wait one minute.',offline:'Unable to connect. Check the network and backend.'},
      de:{headline:'Dein Partner.\nImmer dabei.',description:'Arbeite im Browser weiter. Gespräche, Arbeitsbereiche und Einstellungen bleiben mit deinem Desktop synchron.',sessions:'Gemeinsame Gespräche',workspace:'Ein Arbeitsbereich',preferences:'Synchrone Einstellungen',ready:'Backend bereit',title:'Mit deinem CIBYP verbinden',intro:'Gib das WebUI-Passwort von deinem Desktop oder Terminal ein.',passwordLabel:'Zugangspasswort',codeLabel:'Bestätigungscode',buttonText:'Verbinden und fortfahren',privacy:'Die Anmeldung bleibt in diesem Browser. Greife über ein vertrauenswürdiges Netzwerk auf dein Gerät zu.',reveal:'Passwort anzeigen oder verbergen',loading:'Verbindung wird hergestellt…',invalid:'Passwort oder Code falsch. Bitte erneut versuchen.',limited:'Zu viele Versuche. Bitte eine Minute warten.',offline:'Verbindung fehlgeschlagen. Netzwerk und Backend prüfen.'}
    }, labels=translations[lang]||translations.en, root=document.documentElement;
    root.lang=translations[lang]?lang:'en';for(const[id,text]of Object.entries(labels)){const el=document.getElementById(id);if(el)el.textContent=text;}
    const theme=preferences.theme||{},dark=theme.mode==='dark'||(theme.mode!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme=dark?'dark':'light';root.dataset.motion=preferences.animations===false?'off':'on';
    root.style.setProperty('--bg',dark?'#151a22':'#f5f7fa');
    if(/^#[\da-f]{6}$/i.test(theme.backgroundColor||''))root.style.setProperty('--bg',theme.backgroundColor);
    if(/^#[\da-f]{6}$/i.test(theme.accentColor||'')){root.style.setProperty('--accent',theme.accentColor);const rgb=theme.accentColor.match(/\w{2}/g).map(v=>parseInt(v,16));root.style.setProperty('--on-accent',rgb[0]*.299+rgb[1]*.587+rgb[2]*.114>150?'#17212b':'#fff');}
    document.getElementById('host').textContent=location.host;document.getElementById('codeWrap').hidden=!preferences.enable2FA;document.getElementById('code').required=!!preferences.enable2FA;
    const password=document.getElementById('password'),reveal=document.getElementById('reveal');reveal.setAttribute('aria-label',labels.reveal);reveal.onclick=()=>{password.type=password.type==='password'?'text':'password';reveal.setAttribute('aria-pressed',String(password.type==='text'));password.focus();};
    document.querySelector('form').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;button.setAttribute('aria-busy','true');document.getElementById('buttonText').textContent=labels.loading;error.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-CIBYP-Client':'1'},body:JSON.stringify({password:password.value,code:document.getElementById('code').value}),signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error(response.status===401?labels.invalid:response.status===429?labels.limited:labels.offline);location.replace('/');}catch(err){error.textContent=err.name==='Error'?err.message:labels.offline;button.disabled=false;button.removeAttribute('aria-busy');document.getElementById('buttonText').textContent=labels.buttonText;}};
  </script>
</body>
</html>
