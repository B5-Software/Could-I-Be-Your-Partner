<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .splash {
      width: 100%; height: 100%;
      border-radius: 16px;
      background: linear-gradient(160deg, #23262e 0%, #17181d 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      color: #e6e8ef;
    }
    .icon {
      width: 88px; height: 88px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .name {
      font-size: 17px; font-weight: 600; letter-spacing: 0.5px;
    }
    .spinner {
      width: 26px; height: 26px;
      border: 3px solid rgba(230, 232, 239, 0.18);
      border-top-color: #5aa2ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <img class="icon" src="../../../assets/icons/icon.png" alt="">
    <div class="name">Could I Be Your Partner</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
