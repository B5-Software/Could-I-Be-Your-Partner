<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>崩溃报告</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #15171c; color: #e6e8ee; font-size: 13px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .cr-titlebar {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      background: #1b1e26; border-bottom: 1px solid #2a2f3a; -webkit-app-region: drag;
      user-select: none;
    }
    .cr-titlebar i { color: #f59e0b; }
    .cr-title { font-weight: 600; }
    .cr-sub { color: #8b93a7; margin-left: 6px; }
    .cr-close {
      margin-left: auto; -webkit-app-region: no-drag; background: transparent; color: #9aa3b5;
      border: 1px solid #333a49; border-radius: 6px; width: 30px; height: 26px; cursor: pointer;
    }
    .cr-close:hover { background: #2a3040; color: #fff; }
    .cr-body { flex: 1; overflow-y: auto; padding: 14px; }
    .cr-card { background: #1b1e26; border: 1px solid #2a2f3a; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .cr-card h2 { font-size: 13px; margin-bottom: 8px; color: #c7cddc; display: flex; align-items: center; gap: 6px; }
    .cr-kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; color: #aab2c5; }
    .cr-kv b { color: #e6e8ee; font-weight: 500; word-break: break-all; }
    .cr-record { border-left: 3px solid #ef4444; padding: 6px 10px; margin: 6px 0; background: #201a1d; border-radius: 6px; }
    .cr-record .src { color: #f87171; font-weight: 600; }
    .cr-record pre, .cr-log { white-space: pre-wrap; word-break: break-all; font-family: Consolas, monospace; font-size: 11.5px; color: #b9c0d0; margin-top: 4px; max-height: 260px; overflow: auto; }
    .cr-dump { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px dashed #2a2f3a; }
    .cr-dump:last-child { border-bottom: none; }
    .cr-dump .name { flex: 1; word-break: break-all; }
    .cr-dump .size { color: #8b93a7; }
    .cr-empty { color: #6b7385; }
    .cr-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-top: 1px solid #2a2f3a; background: #1b1e26; }
    .cr-actions button {
      padding: 8px 13px; border-radius: 7px; border: 1px solid #333a49; background: #222735;
      color: #dfe3ee; cursor: pointer; font-size: 12.5px;
    }
    .cr-actions button:hover { background: #2a3040; }
    .cr-actions button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .cr-actions button.primary:hover { background: #5b53f0; }
    .cr-actions button.danger { color: #f87171; border-color: #513040; }
    .cr-status { margin-left: auto; color: #8b93a7; align-self: center; }
  </style>
</head>
<body>
  <div class="cr-titlebar">
    <i class="fa-solid fa-triangle-exclamation">!</i>
    <span class="cr-title">上次运行异常退出</span>
    <span class="cr-sub" id="cr-when"></span>
    <button class="cr-close" id="cr-close" title="关闭">✕</button>
  </div>
  <div class="cr-body">
    <div class="cr-card">
      <h2>概览</h2>
      <div class="cr-kv" id="cr-overview"></div>
    </div>
    <div class="cr-card">
      <h2>崩溃记录</h2>
      <div id="cr-records"><div class="cr-empty">无记录（可能是原生进程崩溃，请查看下方转储文件）</div></div>
    </div>
    <div class="cr-card">
      <h2>原生转储文件</h2>
      <div id="cr-dumps"><div class="cr-empty">无 dump 文件</div></div>
    </div>
    <div class="cr-card">
      <h2>日志尾部</h2>
      <pre class="cr-log" id="cr-log">加载中…</pre>
    </div>
  </div>
  <div class="cr-actions">
    <button class="primary" id="cr-export">导出诊断包</button>
    <button id="cr-heap">导出内存快照</button>
    <button id="cr-open-dir">打开转储目录</button>
    <button class="danger" id="cr-dismiss">忽略并清除记录</button>
    <span class="cr-status" id="cr-status"></span>
  </div>
  <script src="../js/crash-report.js"></script>
</body>
</html>
