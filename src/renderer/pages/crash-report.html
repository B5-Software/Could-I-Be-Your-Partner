<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运行诊断 · CIBYP</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/crash-report.css">
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/focus.css">
</head>
<body>
  <header class="cr-titlebar">
    <span class="cr-app-mark" aria-hidden="true">C</span>
    <span>CIBYP <span class="cr-title-divider">/</span> 运行诊断</span>
    <button class="cr-close" id="cr-close" aria-label="关闭诊断窗口" title="关闭">×</button>
  </header>
  <main class="cr-body" aria-busy="true">
    <section class="cr-hero" aria-labelledby="cr-heading">
      <div class="cr-hero-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 2.5 20h19L12 3Z" stroke-linejoin="round"/><path d="M12 9v5m0 3v.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <p class="cr-eyebrow">异常退出记录</p>
        <h1 id="cr-heading">上次运行意外中断</h1>
        <p class="cr-description" id="cr-description">正在读取诊断信息…</p>
      </div>
    </section>
    <section class="cr-summary" aria-label="异常摘要">
      <div class="cr-cause"><span class="cr-label">最近异常</span><p id="cr-cause">读取中…</p><span id="cr-source" class="cr-muted"></span></div>
      <dl class="cr-facts">
        <div><dt>异常时间</dt><dd id="cr-when">—</dd></div>
        <div><dt>被中断会话</dt><dd id="cr-sessions">—</dd></div>
        <div><dt>应用版本</dt><dd id="cr-version">—</dd></div>
      </dl>
    </section>
    <div class="cr-section-heading"><h2>诊断详情</h2><span class="cr-muted">按需展开</span></div>
    <section class="cr-details" aria-label="技术诊断信息">
      <details id="cr-record-details">
        <summary><span class="cr-detail-icon" aria-hidden="true">⌁</span><span>异常记录</span><span class="cr-count" id="cr-record-count">0</span></summary>
        <div class="cr-detail-body" id="cr-records"></div>
      </details>
      <details id="cr-log-details">
        <summary><span class="cr-detail-icon" aria-hidden="true">≡</span><span>最近日志</span><span class="cr-summary-note">末尾 300 行</span></summary>
        <div class="cr-detail-body"><pre class="cr-log" id="cr-log">读取中…</pre><button class="cr-text-button" id="cr-open-logs">打开日志目录 ↗</button></div>
      </details>
      <details id="cr-system-details">
        <summary><span class="cr-detail-icon" aria-hidden="true">◇</span><span>环境与转储</span><span class="cr-summary-note" id="cr-dump-count">0 个转储文件</span></summary>
        <div class="cr-detail-body"><dl class="cr-kv" id="cr-overview"></dl><h3>原生转储文件</h3><div id="cr-dumps"></div><button class="cr-text-button" id="cr-open-dir">打开转储目录 ↗</button></div>
      </details>
      <details id="cr-advanced-details">
        <summary><span class="cr-detail-icon" aria-hidden="true">⚙</span><span>高级操作</span></summary>
        <div class="cr-detail-body cr-advanced">
          <div><h3>当前内存快照</h3><p>记录本次运行的内存状态，供排查使用。生成时应用可能短暂暂停。</p><button id="cr-heap">导出内存快照</button></div>
          <div><h3>清除异常记录</h3><p>清除已保存的异常标记；日志和转储文件会保留。</p><button id="cr-dismiss" class="cr-danger">清除记录并关闭</button></div>
        </div>
      </details>
    </section>
  </main>
  <footer class="cr-footer">
    <p class="cr-status" id="cr-status" role="status" aria-live="polite"></p>
    <div class="cr-actions">
      <button id="cr-copy">复制报告</button>
      <button id="cr-export">导出诊断包</button>
      <button class="cr-primary" id="cr-continue">继续使用 <span aria-hidden="true">→</span></button>
    </div>
  </footer>
  <script src="../js/subapp-theme.js"></script>
  <script src="../js/crash-report.js"></script>
</body>
</html>
